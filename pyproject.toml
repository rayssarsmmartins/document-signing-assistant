[project]
name = "clicksign-pontual"
version = "0.1.0"
description = "Ferramentas locais (cs) do workspace agêntico Envio Pontual — jornada da persona Pontual sobre o MCP da Clicksign."
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.0",
    "python-docx>=1.1",
    "jsonschema>=4.23",
    "boto3>=1.35",
]

[project.optional-dependencies]
gcs = ["google-cloud-storage>=2.18"]

[project.scripts]
cs = "cs.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "fpdf2>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
